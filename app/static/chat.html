<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Car Showroom Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* LOGIN CARD */
        .login-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 32px;
            color: #fff;
        }
        .login-card h2 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .login-card p {
            text-align: center;
            color: rgba(255,255,255,0.5);
            margin-bottom: 28px;
            font-size: 0.9rem;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #7c5cfc;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .login-btn:hover { opacity: 0.9; }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-error {
            color: #ff6b6b;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 12px;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .role-admin { background: #ff6b35; color: #fff; }
        .role-customer { background: #22c55e; color: #fff; }

        /* CHAT UI */
        .chat-container {
            display: none;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            height: 85vh;
            max-height: 700px;
            display: none;
            flex-direction: column;
        }

        .chat-header {
            padding: 18px 24px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-left h3 {
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
        }
        .chat-header-left span {
            color: rgba(255,255,255,0.4);
            font-size: 0.78rem;
        }
        .logout-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: rgba(255,59,48,0.2);
            border-color: rgba(255,59,48,0.4);
            color: #ff6b6b;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            border-bottom-left-radius: 4px;
        }
        .msg-bot .cars-list {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .car-item {
            padding: 8px 10px;
            margin: 4px 0;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            font-size: 0.82rem;
        }
        .car-item .car-brand { font-weight: 600; }
        .car-item .car-price { color: #a78bfa; }
        .car-item .car-status { 
            font-size: 0.72rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .status-tersedia { background: rgba(34,197,94,0.2); color: #4ade80; }
        .status-terjual { background: rgba(239,68,68,0.2); color: #f87171; }

        .typing-indicator {
            align-self: flex-start;
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
        }
        .typing-indicator span {
            width: 8px; height: 8px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 24px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus { border-color: #7c5cfc; }
        .chat-input-area input::placeholder { color: rgba(255,255,255,0.3); }
        .send-btn {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.1s;
        }
        .send-btn:hover { opacity: 0.85; }
        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN -->
        <div class="login-card" id="loginCard">
            <h2>🚗 Car Showroom AI</h2>
            <p>Login untuk mulai chat dengan asisten AI</p>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="johndoe" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="login-btn" id="loginBtn" onclick="doLogin()">Login</button>
            <div class="login-error" id="loginError"></div>
        </div>

        <!-- CHAT -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <div class="chat-header-left">
                    <h3>🤖 AI Assistant</h3>
                    <span id="userInfo"></span>
                </div>
                <button class="logout-btn" onclick="doLogout()">Logout</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg msg-bot">
                    Halo! Saya asisten AI showroom mobil. Silakan bertanya tentang mobil yang tersedia, budget, atau buat jadwal kunjungan! 🚗
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api/v1';
        let token = '';
        let userRole = '';
        let sessionId = 'session-' + Date.now();

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            
            if (!username || !password) { errEl.textContent = 'Isi username dan password!'; return; }
            
            btn.disabled = true;
            btn.textContent = 'Loading...';
            errEl.textContent = '';

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok && data.data) {
                    token = data.data.access_token;
                    userRole = data.data.role;
                    
                    document.getElementById('loginCard').style.display = 'none';
                    document.getElementById('chatContainer').style.display = 'flex';
                    
                    const roleBadge = `<span class="role-badge role-${userRole}">${userRole}</span>`;
                    document.getElementById('userInfo').innerHTML = `${username} ${roleBadge}`;
                    
                    document.getElementById('chatInput').focus();
                } else {
                    errEl.textContent = data.detail || 'Login gagal!';
                }
            } catch (e) {
                errEl.textContent = 'Koneksi ke server gagal!';
            }
            btn.disabled = false;
            btn.textContent = 'Login';
        }

        function doLogout() {
            token = '';
            userRole = '';
            document.getElementById('chatContainer').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('chatMessages').innerHTML = `
                <div class="msg msg-bot">
                    Halo! Saya asisten AI showroom mobil. Silakan bertanya tentang mobil yang tersedia, budget, atau buat jadwal kunjungan! 🚗
                </div>`;
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            // Add user message
            addMessage(msg, 'user');
            input.value = '';
            
            // Typing indicator
            const typingEl = document.createElement('div');
            typingEl.className = 'typing-indicator';
            typingEl.innerHTML = '<span></span><span></span><span></span>';
            document.getElementById('chatMessages').appendChild(typingEl);
            scrollToBottom();

            // Disable input
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                const res = await fetch(`${API}/ai/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ session_id: sessionId, message: msg })
                });
                
                typingEl.remove();

                if (res.status === 401) {
                    addMessage('Sesi Anda telah berakhir. Silakan login ulang.', 'bot');
                    setTimeout(doLogout, 2000);
                    return;
                }

                const data = await res.json();
                if (data.data) {
                    addMessage(data.data.reply, 'bot', data.data.car_recommendations);
                } else {
                    addMessage('Maaf, terjadi kesalahan.', 'bot');
                }
            } catch (e) {
                typingEl.remove();
                addMessage('Gagal terhubung ke server.', 'bot');
            }

            input.disabled = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }

        function addMessage(text, type, cars = []) {
            const messagesEl = document.getElementById('chatMessages');
            const msgEl = document.createElement('div');
            msgEl.className = `msg msg-${type}`;
            
            // Format newlines
            let html = text.replace(/\n/g, '<br>');
            
            // Add car recommendations if any
            if (cars && cars.length > 0) {
                html += '<div class="cars-list"><strong>📋 Rekomendasi:</strong>';
                cars.forEach(car => {
                    const statusClass = car.status === 'Tersedia' ? 'status-tersedia' : 'status-terjual';
                    html += `<div class="car-item">
                        <span class="car-brand">${car.brand}</span> (${car.type})<br>
                        <span class="car-price">Rp ${Number(car.price).toLocaleString('id-ID')}</span>
                        <span class="car-status ${statusClass}">${car.status}</span>
                    </div>`;
                });
                html += '</div>';
            }

            msgEl.innerHTML = html;
            messagesEl.appendChild(msgEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            const el = document.getElementById('chatMessages');
            el.scrollTop = el.scrollHeight;
        }

        // Enter key on password field
        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
